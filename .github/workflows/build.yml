name: Build

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 (preview image): the iOS 27 SDK has the audio schemas the new Siri uses
    # (Koda/Intents/SiriSchemas.swift). Without it that file is left out and the app still builds.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Compute release identity
        id: version
        run: python3 scripts/build-version.py --github-output "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate localization catalogs
        run: python3 scripts/validate-localization.py

      - name: Test KodaCore
        working-directory: KodaCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../core-tests.log

      - name: Collect Core test crash diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import time
          destination = Path("test-diagnostics")
          destination.mkdir(exist_ok=True)
          reports = Path.home() / "Library/Logs/DiagnosticReports"
          for attempt in range(10):
              found = [p for p in reports.glob("*")
                       if p.is_file() and p.suffix in (".ips", ".crash")
                       and ("swiftpm-testing" in p.name or "KodaCoreTests" in p.name)
                       and p.stat().st_mtime >= time.time() - 3600]
              if found:
                  for report in found:
                      shutil.copy2(report, destination / report.name)
                  print(f"Saved {len(found)} Core test crash report(s).")
                  break
              if attempt < 9:
                  time.sleep(2)
          else:
              print("No Core test crash report was produced; core-tests.log is retained.")
          PY

      - name: Build unsigned app
        run: |
          # Without pipefail the job passes on tail's exit status even when the build fails.
          set -o pipefail
          xcodebuild -project Koda.xcodeproj -scheme Koda -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 40 \
            || { echo "::group::Errors"; grep -E "error:" build.log | sort -u | head -100; echo "::endgroup::"; exit 1; }

      # An unsigned .ipa: AltStore, SideStore and Sideloadly sign it with the installer's own Apple ID.
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Koda.app Payload/
          zip -qry "${{ steps.version.outputs.ipa_name }}" Payload
          ls -lh "${{ steps.version.outputs.ipa_name }}"

      - name: Verify IPA versions, executables, CarPlay and Traditional Chinese resources
        run: |
          python3 scripts/verify-ipa.py "${{ steps.version.outputs.ipa_name }}" \
            --version "${{ steps.version.outputs.version }}" \
            --build "${{ steps.version.outputs.build_number }}" \
            --output localization-check --apple-tools --require-carplay
          bash scripts/verify-localization.sh localization-check/Payload/Koda.app

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}-build-log
          path: |
            build.log
            core-tests.log
            test-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.version.outputs.ipa_name }}
          retention-days: 30

  mac:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Compute release identity
        id: version
        run: python3 scripts/build-version.py --github-output "$GITHUB_OUTPUT"

      # One binary for Apple silicon and Intel. Ad-hoc signed: Apple silicon refuses to run
      # unsigned code, and without a Developer ID there is nothing better to sign with.
      - name: Build universal Mac app
        run: |
          set -o pipefail
          xcodebuild -project Koda.xcodeproj -scheme Koda -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log | tail -n 40 \
            || { echo "::group::Errors"; grep -E "error:" build.log | sort -u | head -100; echo "::endgroup::"; exit 1; }
          lipo -info build/Build/Products/Release-maccatalyst/Koda.app/Contents/MacOS/Koda

      # The usual disk image: Koda beside a link to Applications, to drag across.
      - name: Package .dmg
        run: |
          mkdir dmg
          cp -R build/Build/Products/Release-maccatalyst/Koda.app dmg/
          ln -s /Applications dmg/Applications
          # APFS metadata can exceed hdiutil's automatic source-folder estimate.
          # Leave 25% plus 128 MiB inside the image; empty space compresses away.
          source_kb=$(du -sk dmg | awk '{print $1}')
          image_mb=$(( (source_kb * 5 + 4095) / 4096 + 128 ))
          df -h .
          hdiutil create -volname Koda -srcfolder dmg -size "${image_mb}m" -fs APFS -format ULFO -ov "${{ steps.version.outputs.dmg_name }}"
          ls -lh "${{ steps.version.outputs.dmg_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}-mac
          path: ${{ steps.version.outputs.dmg_name }}
          retention-days: 30

  simulator:
    strategy:
      fail-fast: false
      matrix:
        device: [compact, large]
    runs-on: xcode-27
    # Isolate each size on a fresh runner: a second boot on a heavily used runner
    # can stall accessibility snapshots. The compact run reached the previous
    # 45-minute test limit after 25 passing tests. Keep time for the full suite
    # and artifact export even when Simulator accessibility actions are slow.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - name: Compute release identity
        id: version
        run: python3 scripts/build-version.py --github-output "$GITHUB_OUTPUT"

      - name: Validate controls on available iPhone Simulators
        timeout-minutes: 60
        env:
          KODA_UI_DEVICE: ${{ matrix.device }}
        run: python3 scripts/run-ui-smoke.py

      - name: Upload UI results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}-ui-smoke-${{ matrix.device }}
          path: ui-smoke-results/
          if-no-files-found: warn
          retention-days: 30
